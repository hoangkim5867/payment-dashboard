<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#15395f">
  <title>CSCEC MEP · Payment Archive</title>
  <link rel="stylesheet" href="assets/css/payment-archive.css" data-stage1-extracted="primary">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./"><img class="brand-mark" src="./logo.png" alt="CSCEC"><span>中建二局安装工程有限公司</span></a>
    <select class="language-select" id="languageSelect" aria-label="Ngôn ngữ">
      <option value="vi">Tiếng Việt</option>
      <option value="zh">中文</option>
      <option value="en">English</option>
    </select>
    <a class="back" id="homeLink" href="./">← Trang chủ</a>
  </header>
  <main>
    <div class="heading">
      <div>
        <h1 id="pageHeading">Kho chứng từ thanh toán</h1>
      </div>
    </div>
    <section class="archive-toolbar" id="archiveToolbar" aria-label="Chọn tháng đã chốt">
      <select class="archive-month-select" id="archiveMonthSelect" aria-label="Chọn tháng thanh toán">
        <option value="">Chọn tháng thanh toán</option>
      </select>
      <input class="archive-company-search" id="archiveCompanySearch" type="search" placeholder="Tìm theo tên công ty" aria-label="Tìm theo tên công ty" autocomplete="off" disabled>
      <a class="archive-download" id="archiveDownload" target="_blank" rel="noopener">Tải Excel</a>
    </section>
    <section class="archive-grid" id="archiveGrid" aria-label="Danh sách báo cáo theo tháng"></section>
    <section class="archive-viewer" id="archiveViewer" aria-live="polite"></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <script type="module">
    import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {getFirestore,collection,query,orderBy,getDocs,getDoc,doc,setDoc,serverTimestamp} from "./assets/js/firestore-payment.mjs";

    const firebaseConfig={apiKey:"AIzaSyCApKWORskui_858na0gqnxh3UPzg0mvgE",authDomain:"cscecmep-payment.firebaseapp.com",projectId:"cscecmep-payment",storageBucket:"cscecmep-payment.firebasestorage.app",messagingSenderId:"217279768663",appId:"1:217279768663:web:ad6b423078aee5ca925b12"};
    const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
    const grid=document.getElementById("archiveGrid");
    const viewer=document.getElementById("archiveViewer");
    const monthSelect=document.getElementById("archiveMonthSelect");
    const companySearch=document.getElementById("archiveCompanySearch");
    const archiveDownload=document.getElementById("archiveDownload");
    const languageSelect=document.getElementById("languageSelect");
    const LANGUAGE_KEY="paymentHistoryLanguageV1";
    const I18N={
      vi:{pageTitle:"CSCEC MEP · Kho chứng từ thanh toán",home:"← Trang chủ",archiveHeading:"Kho chứng từ thanh toán",language:"Ngôn ngữ",chooseMonth:"Chọn tháng thanh toán",closedMonths:"Chọn tháng đã chốt",searchCompany:"Công ty / Hợp đồng / IPC / Số tiền",searchResults:"Kết quả tìm kiếm",searchingCompanies:"Đang tìm trong các tháng đã chốt...",noCompanyMatches:"Không tìm thấy dữ liệu phù hợp.",monthColumn:"Tháng",project:"Dự án",openMonth:"Mở tháng",downloadExcel:"Tải Excel",downloadUnc:"Tải UNC",downloadProjectUnc:"Tải UNC",downloadOneUnc:"Tải",month:"Tháng {month} / {year}",report:"Báo cáo",noClosedMonths:"Chưa có tháng nào được chốt.",projectPayments:"Thanh toán dự án",indirectCosts:"Chi phí gián tiếp",unknownProject:"Chưa gắn dự án",payments:"khoản",paid:"Đã thanh toán",close:"Đóng",no:"STT",company:"Công ty",bankAccount:"STK ngân hàng",contractNo:"Số hợp đồng",contractContent:"Nội dung hợp đồng",actualAmount:"Số tiền thực tế",paymentDate:"Ngày thanh toán",viewUnc:"Xem UNC",replaceUnc:"Thay UNC",addUnc:"Bổ sung UNC",completeWorkflow:"Bổ sung tiến trình",noUnc:"Chưa có",noData:"Chưa có dữ liệu",noWebData:"Tháng này chưa có dữ liệu xem trên web. Admin cần chốt lại tháng một lần.",cannotOpen:"Không mở được dữ liệu tháng này. Hãy thử lại sau.",loadingArchive:"Đang tải Kho chứng từ...",loginRequired:"Cần đăng nhập",loginRequiredDetail:"Hãy đăng nhập Payment Management trước, rồi mở lại Kho chứng từ.",accessDenied:"Không có quyền truy cập",accessDeniedDetail:"Tài khoản này chưa được cấp quyền vào hệ thống Payment.",cannotLoad:"Không tải được Kho chứng từ",cannotLoadDetail:"Hãy đăng nhập lại Payment Management rồi thử lại.",searchTotal:"Tổng đã trả",exportSearchExcel:"Xuất Excel kết quả",indexIncomplete:"Có {count} tháng chưa có chỉ mục tìm kiếm đầy đủ; kết quả tìm toàn kho có thể thiếu. Hãy mở tháng cần kiểm tra:",indexMore:"và {count} tháng khác",uncBatchNotice:"Đã yêu cầu tải {count} UNC. Trình duyệt có thể chặn một số tệp; nếu thiếu hãy tải từng tệp bên dưới.",uncBatchLinks:"Liên kết tải UNC riêng lẻ",excelLoading:"Đang tạo Excel...",excelLibraryError:"Không thể tải thư viện Excel. Hãy kiểm tra kết nối mạng rồi thử lại.",excelExportError:"Không xuất được Excel. Hãy thử lại.",excelTotal:"TỔNG"},
      zh:{pageTitle:"CSCEC MEP · 付款凭证库",home:"← 首页",archiveHeading:"付款凭证库",language:"语言",chooseMonth:"选择付款月份",closedMonths:"选择已归档月份",searchCompany:"公司 / 合同 / IPC / 金额",searchResults:"搜索结果",searchingCompanies:"正在搜索已归档月份...",noCompanyMatches:"未找到匹配的数据。",monthColumn:"月份",project:"项目",openMonth:"打开月份",downloadExcel:"下载 Excel",downloadUnc:"下载付款凭证",downloadProjectUnc:"下载付款凭证",downloadOneUnc:"下载",month:"{year}年{month}月",report:"报表",noClosedMonths:"暂无已归档月份。",projectPayments:"项目付款",indirectCosts:"间接费",unknownProject:"未关联项目",payments:"笔",paid:"已付款",close:"关闭",no:"序号",company:"公司",bankAccount:"银行账户",contractNo:"合同编号",contractContent:"合同内容",actualAmount:"实际付款金额",paymentDate:"付款日期",viewUnc:"查看付款凭证",replaceUnc:"替换付款凭证",addUnc:"补充付款凭证",completeWorkflow:"补充流程",noUnc:"暂无",noData:"暂无数据",noWebData:"该月份暂无网页明细，管理员需重新归档该月份一次。",cannotOpen:"无法打开该月份的数据，请稍后重试。",loadingArchive:"正在加载付款凭证库...",loginRequired:"请先登录",loginRequiredDetail:"请先登录付款管理系统，再重新打开付款凭证库。",accessDenied:"无访问权限",accessDeniedDetail:"该账号尚未获得付款系统访问权限。",cannotLoad:"无法加载付款凭证库",cannotLoadDetail:"请重新登录付款管理系统后再试。",searchTotal:"累计已付款",exportSearchExcel:"导出搜索结果 Excel",indexIncomplete:"有{count}个月份尚未建立完整搜索索引，全库搜索结果可能不完整。请打开相关月份核对：",indexMore:"以及另外{count}个月份",uncBatchNotice:"已请求下载{count}个付款凭证。浏览器可能阻止部分文件，如有遗漏请使用下方单独下载链接。",uncBatchLinks:"逐个下载付款凭证",excelLoading:"正在生成 Excel...",excelLibraryError:"无法加载 Excel 库，请检查网络连接。",excelExportError:"导出 Excel 失败，请重试。",excelTotal:"合计"},
      en:{pageTitle:"CSCEC MEP · Payment Archive",home:"← Home",archiveHeading:"Payment Archive",language:"Language",chooseMonth:"Select payment month",closedMonths:"Select a closed month",searchCompany:"Company / Contract / IPC / Amount",searchResults:"Search results",searchingCompanies:"Searching archived months...",noCompanyMatches:"No matching data found.",monthColumn:"Month",project:"Project",openMonth:"Open month",downloadExcel:"Download Excel",downloadUnc:"Download UNC",downloadProjectUnc:"Download UNC",downloadOneUnc:"Download",month:"Month {month} / {year}",report:"Report",noClosedMonths:"No months have been archived yet.",projectPayments:"Project Payments",indirectCosts:"Indirect Costs",unknownProject:"No project assigned",payments:"payments",paid:"Paid",close:"Close",no:"No.",company:"Company",bankAccount:"Bank Account",contractNo:"Contract No.",contractContent:"Contract Content",actualAmount:"Actual Paid Amount",paymentDate:"Payment Date",viewUnc:"View UNC",replaceUnc:"Replace UNC",addUnc:"Add UNC",completeWorkflow:"Complete workflow",noUnc:"Not available",noData:"No data available",noWebData:"No web details are available for this month. An admin needs to archive the month again once.",cannotOpen:"Unable to open this month's data. Please try again later.",loadingArchive:"Loading Payment Archive...",loginRequired:"Sign-in required",loginRequiredDetail:"Sign in to Payment Management, then reopen Payment Archive.",accessDenied:"Access denied",accessDeniedDetail:"This account has not been granted access to the Payment system.",cannotLoad:"Unable to load Payment Archive",cannotLoadDetail:"Sign in to Payment Management again and retry.",searchTotal:"Total paid",exportSearchExcel:"Export search results",indexIncomplete:"{count} month(s) have incomplete search indexes. Archive-wide search may omit records; check the relevant months:",indexMore:"and {count} more",uncBatchNotice:"Requested {count} UNC downloads. The browser may block some files; if any are missing, use the individual links below.",uncBatchLinks:"Individual UNC download links",excelLoading:"Creating Excel...",excelLibraryError:"Excel library unavailable. Check your internet connection.",excelExportError:"Excel export failed. Please try again.",excelTotal:"TOTAL"}
    };
    let currentLanguage=localStorage.getItem(LANGUAGE_KEY)||"vi";
    if(!["vi","zh","en"].includes(currentLanguage)) currentLanguage="vi";
    const t=(key,vars={})=>{
      let text=I18N[currentLanguage]?.[key]??I18N.vi[key]??key;
      Object.entries(vars).forEach(([name,value])=>{text=text.replaceAll(`{${name}}`,String(value));});
      return text;
    };
    let archivesByMonth=new Map();
    let archiveItems=[];
    let currentDetails=null;
    let emptyState=null;
    let viewerMessageKey="";
    let viewerMode="";
    let currentUserIsAdmin=false;
    // Only the current-month archived Payment can be reopened by Staff.
    // Admin retains its existing historical access.
    const activeArchiveWorkflowMonth=new Intl.DateTimeFormat("en-CA",{
      timeZone:"Asia/Ho_Chi_Minh",year:"numeric",month:"2-digit"
    }).format(new Date()).slice(0,7);
    let expandedProjectOrder=[];
    let companySearchGeneration=0;
    let companySearchTimer=null;
    let archiveRequestToken=0;
    let currentGlobalSearchRows=[];
    // Session-only cache: kept only while this page stays open.
    // F5 / reopening the Archive always fetches fresh Firebase data.
    const sessionDetailCache=new Map();
    const escapeHtml=value=>String(value??"").replace(/[&<>'"]/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[char]));
    const icon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h6M9 16h6"/></svg>';
    const moneyMonth=month=>{const [year,value]=String(month||"").split("-");return value&&year?t("month",{month:Number(value),year}):month||t("report")};
    const safeUrl=value=>/^https:\/\//i.test(String(value||"").trim())?String(value).trim():"";
    const formatMoney=value=>new Intl.NumberFormat("en-US",{minimumFractionDigits:0,maximumFractionDigits:2}).format(Number(value||0));
    const normalizeSearch=value=>String(value??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLocaleLowerCase().replace(/\s+/g," ").trim();
    const uncPreview=fileId=>`https://drive.google.com/file/d/${encodeURIComponent(String(fileId||"").trim())}/preview`;
    const uncView=fileId=>`https://drive.google.com/file/d/${encodeURIComponent(String(fileId||"").trim())}/view`;
    const uncDownload=fileId=>`https://drive.google.com/uc?export=download&id=${encodeURIComponent(String(fileId||"").trim())}`;
    const normalizeAmountSearch=value=>{const n=Number(value||0);if(!Number.isFinite(n)) return "";return [String(n),formatMoney(n),String(Math.trunc(n))].join(" ");};
    const buildRowSearchText=row=>normalizeSearch([row?.company,row?.contractNo,row?.contractName,row?.ipcNo,normalizeAmountSearch(row?.actualAmount)].filter(Boolean).join(" "));
    const showEmpty=(title,detail)=>{grid.innerHTML=`<div class="empty"><div><div class="empty-icon">${icon}</div><h2>${escapeHtml(title)}</h2><p>${escapeHtml(detail)}</p></div></div>`};
    const showEmptyKey=(titleKey,detailKey="")=>{
      emptyState={titleKey,detailKey};
      showEmpty(t(titleKey),detailKey?t(detailKey):"");
    };
    const renderMonthOptions=()=>{
      const selected=String(monthSelect.value||"");
      monthSelect.innerHTML=`<option value="">${escapeHtml(t("chooseMonth"))}</option>`+archiveItems.map(item=>`<option value="${escapeHtml(item.month)}">${escapeHtml(moneyMonth(item.month))}</option>`).join("");
      if(archiveItems.some(item=>String(item.month||"")===selected)) monthSelect.value=selected;
    };
    const applyStaticLanguage=()=>{
      document.documentElement.lang=currentLanguage==="zh"?"zh-CN":currentLanguage;
      document.title=t("pageTitle");
      document.getElementById("homeLink").textContent=t("home");
      document.getElementById("pageHeading").textContent=t("archiveHeading");
      document.getElementById("archiveToolbar").setAttribute("aria-label",t("closedMonths"));
      languageSelect.setAttribute("aria-label",t("language"));
      monthSelect.setAttribute("aria-label",t("chooseMonth"));
      companySearch.placeholder=t("searchCompany");
      companySearch.setAttribute("aria-label",t("searchCompany"));
      archiveDownload.textContent=t("downloadExcel");
      languageSelect.value=currentLanguage;
      renderMonthOptions();
    };
    const renderArchives=(archives,isAdmin=false)=>{
      emptyState=null;
      archiveItems=[...archives];
      archivesByMonth=new Map(archives.map(item=>[String(item.month||""),item]));
      currentUserIsAdmin=isAdmin;
      renderMonthOptions();
      monthSelect.disabled=!archives.length;
      companySearch.value="";
      companySearch.disabled=!archives.length;
      archiveDownload.classList.remove("show");
      archiveDownload.removeAttribute("href");
      grid.innerHTML="";
      viewer.classList.remove("show");
      viewer.innerHTML="";
      if(!archives.length){showViewerMessageKey("noClosedMonths");}
    };

    const showViewerMessage=(message,{scroll=true}={})=>{
      viewerMode="message";
      viewer.classList.add("show");
      viewer.innerHTML=`<div class="viewer-message">${escapeHtml(message)}</div>`;
      if(scroll) viewer.scrollIntoView({behavior:"smooth",block:"start"});
    };
    const showViewerMessageKey=key=>{
      viewerMessageKey=key;
      showViewerMessage(t(key));
    };
    const renderDetails=details=>{
      currentDetails=details;
      viewerMode="details";
      viewerMessageKey="";
      expandedProjectOrder=[];
      const rows=Array.isArray(details?.rows)?details.rows:[];
      const month=String(details?.month||"");
      const total=Number(details?.totalActualAmount||0);
      const uncCount=Number(details?.uncCount||0);
      const sortedRows=[...rows].sort((a,b)=>{
        const projectCompare=String(a.project||"").localeCompare(String(b.project||""),"vi",{sensitivity:"base"});
        if(projectCompare) return projectCompare;
        const dateCompare=String(a.paymentDate||"").localeCompare(String(b.paymentDate||""));
        if(dateCompare) return dateCompare;
        return String(a.contractNo||"").localeCompare(String(b.contractNo||""));
      });
      const normalizeCostType=value=>String(value||"").trim().toLocaleLowerCase("vi").replace(/\s+/g," ");
      const normalizeProject=value=>String(value||"").trim().toUpperCase().replace(/\s+/g,"");
      const indirectTypes=new Set([
        normalizeCostType("间接费"),
        normalizeCostType("Chi phí gián tiếp"),
        normalizeCostType("Indirect cost"),
        normalizeCostType("Indirect costs")
      ]);
      const isIndirectRow=row=>
        indirectTypes.has(normalizeCostType(row.costType))&&
        normalizeProject(row.project)!=="FOXCONN";
      const sections=[
        {label:t("projectPayments"),rows:sortedRows.filter(row=>!isIndirectRow(row))},
        {label:t("indirectCosts"),rows:sortedRows.filter(isIndirectRow)}
      ].filter(section=>section.rows.length);
      const body=sections.map((section,sectionIndex)=>{
        const sectionId=`section-${sectionIndex}`;
        const sectionTotal=section.rows.reduce((sum,row)=>sum+(Number(row.actualAmount)||0),0);
        const projectGroups=new Map();
        section.rows.forEach(row=>{
          const project=String(row.project||t("unknownProject"));
          if(!projectGroups.has(project)) projectGroups.set(project,[]);
          projectGroups.get(project).push(row);
        });
        const sectionHeader=`<tr class="section-row" data-section-group="${sectionId}" aria-expanded="false"><td colspan="9"><button type="button" class="section-toggle" data-section-group="${sectionId}"><span class="section-chevron">›</span><span>${escapeHtml(section.label)}</span><span class="section-total">${formatMoney(section.rows.length)} ${escapeHtml(t("payments"))} · ${formatMoney(sectionTotal)} VND</span></button></td></tr>`;
        const projects=Array.from(projectGroups.entries()).map(([project,projectRows],projectIndex)=>{
          const groupId=`${sectionId}-project-${projectIndex}`;
          const subtotal=projectRows.reduce((sum,row)=>sum+(Number(row.actualAmount)||0),0);
          const projectUncIds=projectRows.map(row=>String(row.uncFileId||"").trim()).filter(Boolean);
          const projectDownload=currentUserIsAdmin&&projectUncIds.length?`<button type="button" class="project-unc-download" data-project-unc="${escapeHtml(projectUncIds.join(","))}" title="${escapeHtml(t("downloadProjectUnc"))}">↓ UNC</button>`:"";
          const divider=`<tr class="project-row section-child" data-section-parent="${sectionId}" data-project-group="${groupId}" aria-expanded="false" hidden><td colspan="9"><div class="project-toggle" data-project-group="${groupId}" role="button" tabindex="0"><span class="project-chevron">›</span><span>${escapeHtml(project)}</span><span class="project-total">${formatMoney(projectRows.length)} ${escapeHtml(t("payments"))} · ${formatMoney(subtotal)} VND</span>${projectDownload}</div></td></tr>`;
          const detailRows=projectRows.map(row=>{
            const unc=String(row.uncFileId||"").trim();
            const paymentId=String(row.paymentId||"").trim();
            const editUncUrl=paymentId
              ? `./payment.html?archiveUncPayment=${encodeURIComponent(paymentId)}&archiveMonth=${encodeURIComponent(month)}`
              : "";
            const workflowUrl=paymentId && (currentUserIsAdmin || month===activeArchiveWorkflowMonth)
              ? `./payment.html?archiveWorkflowPayment=${encodeURIComponent(paymentId)}&archiveMonth=${encodeURIComponent(month)}`
              : "";
            const workflowAction=workflowUrl
              ? `<a class="unc-link archive-workflow-link" href="${workflowUrl}" title="${escapeHtml(t("completeWorkflow"))}">${escapeHtml(t("completeWorkflow"))}</a>`
              : "";
            const uncAction=unc
              ? `<span class="unc-actions"><a class="unc-link" href="${uncPreview(unc)}" target="_blank" rel="noopener">${escapeHtml(t("viewUnc"))}</a>${currentUserIsAdmin?`<a class="unc-link unc-download-link" href="${uncDownload(unc)}" target="_blank" rel="noopener" title="${escapeHtml(t("downloadOneUnc"))}">↓</a>`:""}${currentUserIsAdmin&&editUncUrl?`<a class="unc-link unc-replace-link" href="${editUncUrl}" target="_blank" rel="noopener">${escapeHtml(t("replaceUnc"))}</a>`:""}</span>`
              : currentUserIsAdmin&&paymentId
                ? `<a class="unc-link" href="${editUncUrl}" target="_blank" rel="noopener">${escapeHtml(t("addUnc"))}</a>`
                : `<span class="unc-missing">${escapeHtml(t("noUnc"))}</span>`;
            return `<tr class="project-detail-row" data-project-parent="${groupId}" data-company-search="${escapeHtml(buildRowSearchText(row))}" hidden><td class="center visible-row-number"></td><td>${escapeHtml(row.company)}</td><td>${escapeHtml(row.bankAccount||row.bank)}</td><td>${escapeHtml(row.contractNo)}</td><td>${escapeHtml(row.contractName)}</td><td class="center">${escapeHtml(row.ipcNo)}</td><td class="right">${formatMoney(row.actualAmount)}</td><td class="center">${escapeHtml(row.paymentDate)}</td><td class="center"><span class="unc-actions">${uncAction}${workflowAction}</span></td></tr>`;
          }).join("");
          return divider+detailRows;
        }).join("");
        return sectionHeader+projects;
      }).join("");
      viewer.classList.add("show");
      viewer.innerHTML=`<div class="viewer-heading"><div><h2>${escapeHtml(moneyMonth(month))}</h2><p>${escapeHtml(t("paid"))}</p></div><button class="viewer-close" type="button" id="closeArchiveViewer">${escapeHtml(t("close"))}</button></div><div class="viewer-summary"><span><b>${formatMoney(rows.length)}</b>${escapeHtml(t("payments"))}</span><span><b>${formatMoney(total)}</b>VND</span><span><b>${formatMoney(uncCount)}</b>UNC</span></div><div class="viewer-table-wrap"><table class="viewer-table"><thead><tr><th>${escapeHtml(t("no"))}</th><th>${escapeHtml(t("company"))}</th><th>${escapeHtml(t("bankAccount"))}</th><th>${escapeHtml(t("contractNo"))}</th><th>${escapeHtml(t("contractContent"))}</th><th>IPC</th><th>${escapeHtml(t("actualAmount"))}</th><th>${escapeHtml(t("paymentDate"))}</th><th>UNC</th></tr></thead><tbody>${body?`${body}<tr class="search-empty-row" hidden><td colspan="9" class="center">${escapeHtml(t("noCompanyMatches"))}</td></tr>`:`<tr><td colspan="9" class="center">${escapeHtml(t("noData"))}</td></tr>`}</tbody></table></div>`;
      companySearch.disabled=!archiveItems.length;
      applyCompanySearch();
      viewer.scrollIntoView({behavior:"smooth",block:"start"});
    };

    const renumberExpandedRows=()=>{
      viewer.querySelectorAll(".visible-row-number").forEach(cell=>{cell.textContent="";});
      let number=1;
      expandedProjectOrder.forEach(groupId=>{
        viewer.querySelectorAll(`.project-detail-row[data-project-parent="${groupId}"]:not([hidden]) .visible-row-number`).forEach(cell=>{
          cell.textContent=String(number++);
        });
      });
    };

    const applyCompanySearch=()=>{
      const searchTerm=normalizeSearch(companySearch.value);
      const emptyRow=viewer.querySelector(".search-empty-row");
      expandedProjectOrder=[];
      let matchCount=0;
      viewer.querySelectorAll(".section-row").forEach(sectionRow=>{
        const sectionId=String(sectionRow.dataset.sectionGroup||"");
        let sectionHasMatch=false;
        viewer.querySelectorAll(`.project-row[data-section-parent="${sectionId}"]`).forEach(projectRow=>{
          const groupId=String(projectRow.dataset.projectGroup||"");
          const detailRows=Array.from(viewer.querySelectorAll(`.project-detail-row[data-project-parent="${groupId}"]`));
          if(!searchTerm){
            projectRow.hidden=true;
            projectRow.classList.remove("is-open");
            projectRow.setAttribute("aria-expanded","false");
            detailRows.forEach(row=>{row.hidden=true;});
            return;
          }
          let projectHasMatch=false;
          detailRows.forEach(row=>{
            const matches=String(row.dataset.companySearch||"").includes(searchTerm);
            row.hidden=!matches;
            if(matches){projectHasMatch=true;matchCount+=1;}
          });
          projectRow.hidden=!projectHasMatch;
          projectRow.classList.toggle("is-open",projectHasMatch);
          projectRow.setAttribute("aria-expanded",String(projectHasMatch));
          if(projectHasMatch){
            sectionHasMatch=true;
            expandedProjectOrder.push(groupId);
          }
        });
        sectionRow.hidden=Boolean(searchTerm)&&!sectionHasMatch;
        sectionRow.classList.toggle("is-open",Boolean(searchTerm)&&sectionHasMatch);
        sectionRow.setAttribute("aria-expanded",String(Boolean(searchTerm)&&sectionHasMatch));
      });
      if(emptyRow) emptyRow.hidden=!searchTerm||matchCount>0;
      renumberExpandedRows();
    };

    const buildCompanyIndexFromRows=rows=>{
      return (Array.isArray(rows)?rows:[]).map(row=>({
        company:String(row?.company||"").trim(),
        project:String(row?.project||"").trim(),
        contractNo:String(row?.contractNo||"").trim(),
        contractName:String(row?.contractName||"").trim(),
        ipcNo:String(row?.ipcNo||"").trim(),
        actualAmount:Number(row?.actualAmount)||0,
        searchText:buildRowSearchText(row)
      })).filter(entry=>entry.searchText);
    };

    /* Search never fetches old month details. It only uses compact indexes
       already present in archive metadata or details opened in this page session.
       Opening a month once can upgrade its index for future zero-read searches. */
    const enrichArchiveIndexFromSessionDetails=archive=>{
      if(Array.isArray(archive?.companyIndex)&&Number(archive?.companyIndexVersion||0)>=2) return;
      const month=String(archive?.month||"").trim();
      if(!month) return;
      const cached=sessionDetailCache.get(month);
      if(!cached?.rows) return;
      archive.companyIndex=buildCompanyIndexFromRows(cached.rows);
      archive.companyIndexVersion=2;
    };
    const upgradeArchiveIndexFromDetails=async(month,details)=>{
      const archive=archivesByMonth.get(String(month||""));
      if(!archive||!Array.isArray(details?.rows)) return;
      const needsUpgrade=!Array.isArray(archive.companyIndex)||Number(archive.companyIndexVersion||0)<2;
      archive.companyIndex=buildCompanyIndexFromRows(details.rows);
      archive.companyIndexVersion=2;
      archivesByMonth.set(String(month||""),archive);
      const pos=archiveItems.findIndex(item=>String(item.month||"")===String(month||""));
      if(pos>=0) archiveItems[pos]=archive;
      if(!needsUpgrade||!currentUserIsAdmin) return;
      try{
        await setDoc(doc(db,"paymentArchives",String(month||"")),{
          companyIndex:archive.companyIndex,
          companyIndexVersion:2,
          companyIndexUpdatedAt:serverTimestamp()
        },{merge:true});
      }catch(error){
        console.warn("PAYMENT ARCHIVE COMPANY INDEX SAVE ERROR:",month,error);
      }
    };

    const renderGlobalCompanySearch=searchTerm=>{
      archiveItems.forEach(enrichArchiveIndexFromSessionDetails);
      const matches=[];
      archiveItems.forEach(archive=>{
        const month=String(archive.month||"");
        (Array.isArray(archive.companyIndex)?archive.companyIndex:[]).forEach(entry=>{
          const searchable=normalizeSearch(entry?.searchText||[entry?.company,entry?.contractNo,entry?.contractName,entry?.ipcNo,normalizeAmountSearch(entry?.actualAmount)].filter(Boolean).join(" "));
          if(!searchable.includes(searchTerm)) return;
          matches.push({
            month,
            company:String(entry?.company||"").trim(),
            project:String(entry?.project||t("unknownProject")),
            contractNo:String(entry?.contractNo||"").trim(),
            contractName:String(entry?.contractName||"").trim(),
            ipcNo:String(entry?.ipcNo||"").trim(),
            actualAmount:Number(entry?.actualAmount)||0
          });
        });
      });

      currentDetails=null;
      viewerMode="global-search";
      viewerMessageKey="";
      expandedProjectOrder=[];
      archiveDownload.classList.remove("show");
      archiveDownload.removeAttribute("href");
      monthSelect.value="";

      const incompleteMonths=archiveItems.filter(item=>
        !Array.isArray(item.companyIndex)||Number(item.companyIndexVersion||0)<2
      ).map(item=>String(item.month||"")).filter(Boolean);
      const indexWarning=incompleteMonths.length
        ? `<div class="viewer-message" role="status" style="padding:10px 12px;border-bottom:1px solid #e3e9f0;background:#fffaf0;color:#785c32">${escapeHtml(t("indexIncomplete",{count:incompleteMonths.length}))} ${incompleteMonths.slice(0,12).map(month=>`<button type="button" class="search-open-month" data-index-check="1" data-search-month="${escapeHtml(month)}">${escapeHtml(moneyMonth(month))}</button>`).join(" ")}${incompleteMonths.length>12?` ${escapeHtml(t("indexMore",{count:incompleteMonths.length-12}))}`:""}</div>`
        : "";
      const monthCount=new Set(matches.map(item=>item.month)).size;
      const totalPaid=matches.reduce((sum,item)=>sum+(Number(item.actualAmount)||0),0);
      currentGlobalSearchRows=[...matches];
      const rows=matches.map(item=>`<tr><td class="center">${escapeHtml(moneyMonth(item.month))}</td><td>${escapeHtml(item.company)}</td><td>${escapeHtml(item.project)}</td><td>${escapeHtml(item.contractNo)}</td><td class="center">${escapeHtml(item.ipcNo)}</td><td class="right">${formatMoney(item.actualAmount)}</td><td class="center"><button type="button" class="search-open-month" data-search-month="${escapeHtml(item.month)}">${escapeHtml(t("openMonth"))}</button></td></tr>`).join("");
      const adminSearchSummary=currentUserIsAdmin
        ? `<span><b>${formatMoney(totalPaid)}</b>VND · ${escapeHtml(t("searchTotal"))}</span>`
        : "";
      const adminSearchExport=currentUserIsAdmin&&matches.length
        ? `<button type="button" class="archive-download show" id="exportSearchResultsBtn">${escapeHtml(t("exportSearchExcel"))}</button>`
        : "";

      viewer.classList.add("show");
      viewer.innerHTML=`<div class="viewer-heading"><div><h2>${escapeHtml(t("searchResults"))}</h2></div><div style="display:flex;align-items:center;gap:7px">${adminSearchExport}<button class="viewer-close" type="button" id="closeArchiveViewer">${escapeHtml(t("close"))}</button></div></div>${indexWarning}<div class="viewer-summary"><span><b>${formatMoney(matches.length)}</b>${escapeHtml(t("searchResults"))}</span><span><b>${formatMoney(monthCount)}</b>${escapeHtml(t("monthColumn"))}</span>${adminSearchSummary}</div><div class="viewer-table-wrap"><table class="viewer-table global-search-table"><thead><tr><th>${escapeHtml(t("monthColumn"))}</th><th>${escapeHtml(t("company"))}</th><th>${escapeHtml(t("project"))}</th><th>${escapeHtml(t("contractNo"))}</th><th>IPC</th><th>${escapeHtml(t("actualAmount"))}</th><th></th></tr></thead><tbody>${rows||`<tr><td colspan="7" class="center">${escapeHtml(t("noCompanyMatches"))}</td></tr>`}</tbody></table></div>`;
    };

    const exportGlobalSearchExcel=async()=>{
      if(!currentUserIsAdmin||!currentGlobalSearchRows.length) return;
      if(!window.XLSX){alert(t("excelLibraryError"));return;}

      const exportBtn=document.getElementById("exportSearchResultsBtn");
      const oldText=exportBtn?.textContent||"";
      if(exportBtn){exportBtn.disabled=true;exportBtn.textContent=t("excelLoading");}

      try{
        /*
          Global search itself stays zero-read and uses the compact archive index.
          Only when Admin explicitly exports do we read the matched month details
          so the Excel can contain the real UNC link and payment date.
        */
        const months=[...new Set(currentGlobalSearchRows.map(item=>String(item.month||"")).filter(Boolean))];
        const searchTerm=normalizeSearch(companySearch.value);
        const exportRows=[];

        for(const month of months){
          let details=sessionDetailCache.get(month);
          if(!details){
            const snap=await getDoc(doc(db,"paymentArchiveDetails",month));
            if(!snap.exists()) continue;
            details=snap.data();
            sessionDetailCache.set(month,details);
          }

          (Array.isArray(details?.rows)?details.rows:[]).forEach(row=>{
            if(!buildRowSearchText(row).includes(searchTerm)) return;
            exportRows.push({
              month,
              project:String(row?.project||"").trim(),
              company:String(row?.company||"").trim(),
              contractNo:String(row?.contractNo||"").trim(),
              contractName:String(row?.contractName||"").trim(),
              ipcNo:String(row?.ipcNo||"").trim(),
              actualAmount:Number(row?.actualAmount)||0,
              paymentDate:String(row?.paymentDate||"").trim(),
              uncFileId:String(row?.uncFileId||"").trim()
            });
          });
        }

        exportRows.sort((a,b)=>
          String(b.month).localeCompare(String(a.month)) ||
          String(a.paymentDate).localeCompare(String(b.paymentDate)) ||
          String(a.company).localeCompare(String(b.company),"vi",{sensitivity:"base"})
        );

        const headers=[t("no"),t("monthColumn"),t("paymentDate"),t("project"),t("company"),t("contractNo"),t("contractContent"),"IPC",t("actualAmount"),"UNC"];
        const record=values=>Object.fromEntries(headers.map((header,index)=>[header,values[index]]));
        const data=exportRows.map((item,index)=>record([
          index+1,String(item.month||""),String(item.paymentDate||""),String(item.project||""),
          String(item.company||""),String(item.contractNo||""),String(item.contractName||""),
          String(item.ipcNo||""),Number(item.actualAmount)||0,item.uncFileId?"UNC":""
        ]));

        const total=exportRows.reduce((sum,item)=>sum+(Number(item.actualAmount)||0),0);
        data.push(record(["","","","",t("excelTotal"),"","","",total,""]));

        const ws=window.XLSX.utils.json_to_sheet(data);
        ws["!cols"]=[
          {wch:7},{wch:12},{wch:16},{wch:16},{wch:42},
          {wch:42},{wch:42},{wch:14},{wch:20},{wch:12}
        ];
        ws["!autofilter"]={ref:`A1:J${Math.max(1,data.length)}`};
        ws["!freeze"]={xSplit:0,ySplit:1,topLeftCell:"A2",activePane:"bottomLeft",state:"frozen"};
        ws["!rows"]=[{hpt:23}];

        /* Search export intentionally mirrors the clean monthly Excel style:
           light blue-grey header, thin borders, readable totals, no dashboard title. */
        const thinBorder={
          top:{style:"thin",color:{rgb:"D9E2EC"}},
          bottom:{style:"thin",color:{rgb:"D9E2EC"}},
          left:{style:"thin",color:{rgb:"D9E2EC"}},
          right:{style:"thin",color:{rgb:"D9E2EC"}}
        };
        const headerStyle={
          font:{name:"Arial",sz:10,bold:true,color:{rgb:"17365D"}},
          fill:{patternType:"solid",fgColor:{rgb:"DCE6F1"}},
          border:thinBorder,
          alignment:{vertical:"center",horizontal:"center",wrapText:true}
        };
        const bodyStyle={
          font:{name:"Arial",sz:10,color:{rgb:"1F2937"}},
          border:thinBorder,
          alignment:{vertical:"center",wrapText:false}
        };
        const totalStyle={
          font:{name:"Arial",sz:10,bold:true,color:{rgb:"17365D"}},
          fill:{patternType:"solid",fgColor:{rgb:"EEF3F8"}},
          border:thinBorder,
          alignment:{vertical:"center"}
        };

        for(let c=0;c<10;c++){
          const addr=window.XLSX.utils.encode_cell({r:0,c});
          if(ws[addr]) ws[addr].s=headerStyle;
        }

        for(let r=1;r<=data.length;r++){
          for(let c=0;c<10;c++){
            const addr=window.XLSX.utils.encode_cell({r,c});
            if(ws[addr]) ws[addr].s={...bodyStyle};
          }
        }

        /* Dates and money. */
        for(let r=2;r<=data.length+1;r++){
          const moneyCell=ws[`I${r}`];
          if(moneyCell){
            moneyCell.z='#,##0';
            moneyCell.s={...bodyStyle,alignment:{vertical:"center",horizontal:"right"}};
          }
          const dateCell=ws[`C${r}`];
          if(dateCell) dateCell.s={...bodyStyle,alignment:{vertical:"center",horizontal:"center"}};
          const sttCell=ws[`A${r}`];
          if(sttCell) sttCell.s={...bodyStyle,alignment:{vertical:"center",horizontal:"center"}};
          const monthCell=ws[`B${r}`];
          if(monthCell) monthCell.s={...bodyStyle,alignment:{vertical:"center",horizontal:"center"}};
          const ipcCell=ws[`H${r}`];
          if(ipcCell) ipcCell.s={...bodyStyle,alignment:{vertical:"center",horizontal:"center"}};
        }

        /* Clickable UNC links. Use /view rather than /preview for Excel hyperlinks. */
        exportRows.forEach((item,index)=>{
          if(!item.uncFileId) return;
          const cell=ws[`J${index+2}`];
          if(!cell) return;
          cell.v="UNC";
          cell.t="s";
          cell.l={Target:uncView(item.uncFileId),Tooltip:"Mở UNC trên Google Drive"};
          cell.s={
            ...bodyStyle,
            font:{name:"Arial",sz:10,color:{rgb:"0563C1"},underline:true},
            alignment:{vertical:"center",horizontal:"center"}
          };
        });

        /* Total row. */
        const totalRow=data.length; // zero-based worksheet row index
        for(let c=0;c<10;c++){
          const addr=window.XLSX.utils.encode_cell({r:totalRow,c});
          if(ws[addr]) ws[addr].s={...totalStyle};
        }
        const totalMoney=ws[`I${totalRow+1}`];
        if(totalMoney){
          totalMoney.z='#,##0';
          totalMoney.s={...totalStyle,alignment:{vertical:"center",horizontal:"right"}};
        }
        const totalLabel=ws[`E${totalRow+1}`];
        if(totalLabel) totalLabel.s={...totalStyle,alignment:{vertical:"center",horizontal:"left"}};

        const wb=window.XLSX.utils.book_new();
        window.XLSX.utils.book_append_sheet(wb,ws,currentLanguage==="zh"?"搜索结果":currentLanguage==="en"?"Search Results":"Kết quả tìm kiếm");
        const q=String(companySearch.value||"search").trim().replace(/[\/:*?"<>|]+/g,"_").slice(0,45)||"search";
        window.XLSX.writeFile(wb,`Payment_Search_${q}.xlsx`);
      }catch(error){
        console.error("EXPORT SEARCH EXCEL ERROR:",error);
        alert(t("excelExportError"));
      }finally{
        if(exportBtn){exportBtn.disabled=false;exportBtn.textContent=oldText||t("exportSearchExcel");}
      }
    };

    const runCompanySearch=()=>{
      const generation=++companySearchGeneration;
      const searchTerm=normalizeSearch(companySearch.value);
      const selectedMonth=String(monthSelect.value||"").trim();
      if(selectedMonth){
        // When a month is selected, filter its existing rows without reading more Firebase data.
        if(currentDetails&&String(currentDetails.month||"")===selectedMonth) applyCompanySearch();
        return; // If the month is still loading, renderDetails will apply the search.
      }
      if(!searchTerm){
        viewerMessageKey="";
        currentDetails=null;
        viewerMode="";
        currentGlobalSearchRows=[];
        viewer.classList.remove("show");
        viewer.innerHTML="";
        return;
      }
      currentDetails=null;
      expandedProjectOrder=[];
      if(generation!==companySearchGeneration) return;
      renderGlobalCompanySearch(searchTerm);
    };
    const handleCompanySearchInput=()=>{
      clearTimeout(companySearchTimer);
      companySearchTimer=setTimeout(runCompanySearch,250);
    };

    const openArchiveMonth=async(month,{preserveSearch=false}={})=>{
      if(!month) return;
      const token=++archiveRequestToken;
      monthSelect.disabled=true;
      if(!preserveSearch) companySearch.value="";
      companySearch.disabled=true;
      showViewerMessage(t("loadingArchive"),{scroll:false});
      const archive=archivesByMonth.get(month)||{};
      archiveDownload.classList.remove("show");
      const cached=sessionDetailCache.get(month);
      if(cached){
        if(token!==archiveRequestToken||monthSelect.value!==month)return;
        renderDetails({...cached,month});
        upgradeArchiveIndexFromDetails(month,cached);
        const excel=safeUrl(archive.excelDownloadUrl||archive.excelUrl);
        if(currentUserIsAdmin&&excel){archiveDownload.href=excel;archiveDownload.classList.add("show");}
        monthSelect.disabled=!archiveItems.length;
        companySearch.disabled=!archiveItems.length;
        return;
      }
      try{
        const details=await getDoc(doc(db,"paymentArchiveDetails",month));
        if(token!==archiveRequestToken||monthSelect.value!==month)return;
        if(!details.exists()){
          currentDetails=null;
          showViewerMessageKey("noWebData");
          return;
        }
        const data=details.data();
        sessionDetailCache.set(month,data);
        renderDetails({...data,month});
        upgradeArchiveIndexFromDetails(month,data);
        const excel=safeUrl(archive.excelDownloadUrl||archive.excelUrl);
        if(currentUserIsAdmin&&excel){
          archiveDownload.href=excel;
          archiveDownload.classList.add("show");
        }
      }catch(error){
        if(token!==archiveRequestToken)return;
        console.error("PAYMENT ARCHIVE DETAIL ERROR:",error);
        currentDetails=null;
        showViewerMessageKey("cannotOpen");
      }finally{
        if(token===archiveRequestToken){
          monthSelect.disabled=!archiveItems.length;
          companySearch.disabled=!archiveItems.length;
        }
      }
    };
    monthSelect.addEventListener("change",()=>{
      companySearchGeneration+=1;
      const month=String(monthSelect.value||"").trim();
      if(month){openArchiveMonth(month);return;}
      archiveRequestToken++;
      if(companySearch.value.trim()){runCompanySearch();return;}
      currentDetails=null;
      viewerMode="";
      viewerMessageKey="";
      companySearch.value="";
      archiveDownload.classList.remove("show");
      archiveDownload.removeAttribute("href");
      viewer.classList.remove("show");
      viewer.innerHTML="";
    });
    companySearch.addEventListener("input",handleCompanySearchInput);
    viewer.addEventListener("click",event=>{
      const exportSearchButton=event.target.closest("#exportSearchResultsBtn");
      if(exportSearchButton){
        event.preventDefault();
        exportGlobalSearchExcel();
        return;
      }

      const searchMonthButton=event.target.closest(".search-open-month");
      if(searchMonthButton){
        const month=String(searchMonthButton.dataset.searchMonth||"").trim();
        if(month){
          companySearchGeneration+=1;
          monthSelect.value=month;
          openArchiveMonth(month,{preserveSearch:searchMonthButton.dataset.indexCheck!=="1"});
        }
        return;
      }
      const projectUncDownload=event.target.closest(".project-unc-download");
      if(projectUncDownload){
        event.preventDefault();
        event.stopPropagation();
        const ids=String(projectUncDownload.dataset.projectUnc||"").split(",").map(v=>v.trim()).filter(Boolean);
        // Batch downloads can be blocked by the browser. Always expose manual links too.
        viewer.querySelector(".unc-batch-status")?.remove();
        const panel=document.createElement("div");
        panel.className="viewer-message unc-batch-status";
        panel.setAttribute("role","status");
        panel.style.cssText="padding:10px 12px;border-bottom:1px solid #e3e9f0;background:#fbfdff";
        panel.innerHTML=`<div>${escapeHtml(t("uncBatchNotice",{count:ids.length}))}</div><div style="margin-top:7px">${escapeHtml(t("uncBatchLinks"))}: <span style="display:inline-flex;flex-wrap:wrap;gap:5px">${ids.map((id,i)=>`<a class="unc-link" href="${uncDownload(id)}" target="_blank" rel="noopener" download>UNC ${i+1}</a>`).join("")}</span></div>`;
        viewer.querySelector(".viewer-heading")?.after(panel);
        ids.forEach((id,index)=>{
          const frame=document.createElement("iframe");
          frame.hidden=true;
          frame.src=uncDownload(id);
          document.body.appendChild(frame);
          setTimeout(()=>frame.remove(),15000+index*250);
        });
        return;
      }

      const sectionToggle=event.target.closest(".section-toggle");
      if(sectionToggle){
        const sectionId=String(sectionToggle.dataset.sectionGroup||"");
        const sectionRow=sectionToggle.closest(".section-row");
        const willOpen=!sectionRow.classList.contains("is-open");
        const closingGroups=[];
        sectionRow.classList.toggle("is-open",willOpen);
        sectionRow.setAttribute("aria-expanded",String(willOpen));
        viewer.querySelectorAll(`.project-row[data-section-parent="${sectionId}"]`).forEach(projectRow=>{
          projectRow.hidden=!willOpen;
          if(!willOpen){
            projectRow.classList.remove("is-open");
            projectRow.setAttribute("aria-expanded","false");
            const groupId=String(projectRow.dataset.projectGroup||"");
            closingGroups.push(groupId);
            viewer.querySelectorAll(`[data-project-parent="${groupId}"]`).forEach(row=>{row.hidden=true;});
          }
        });
        if(closingGroups.length){
          expandedProjectOrder=expandedProjectOrder.filter(groupId=>!closingGroups.includes(groupId));
          renumberExpandedRows();
        }
        return;
      }
      const toggle=event.target.closest(".project-toggle");
      if(toggle){
        const groupId=String(toggle.dataset.projectGroup||"");
        const projectRow=toggle.closest(".project-row");
        const willOpen=!projectRow.classList.contains("is-open");
        projectRow.classList.toggle("is-open",willOpen);
        projectRow.setAttribute("aria-expanded",String(willOpen));
        viewer.querySelectorAll(`[data-project-parent="${groupId}"]`).forEach(row=>{row.hidden=!willOpen;});
        if(willOpen){
          if(!expandedProjectOrder.includes(groupId)) expandedProjectOrder.push(groupId);
        }else{
          expandedProjectOrder=expandedProjectOrder.filter(id=>id!==groupId);
        }
        renumberExpandedRows();
        return;
      }
      if(event.target.closest("#closeArchiveViewer")){
        archiveRequestToken++;
        monthSelect.disabled=!archiveItems.length;
        companySearch.disabled=!archiveItems.length;
        companySearchGeneration+=1;
        expandedProjectOrder=[];
        currentDetails=null;
        viewerMode="";
        companySearch.value="";
        companySearch.disabled=!archiveItems.length;
        monthSelect.value="";
        viewerMessageKey="";
        viewer.classList.remove("show");
        viewer.innerHTML="";
      }
    });

    viewer.addEventListener("keydown",event=>{
      const projectToggle=event.target.closest?.(".project-toggle");
      if(!projectToggle||!['Enter',' '].includes(event.key)) return;
      event.preventDefault();
      projectToggle.click();
    });

    languageSelect.addEventListener("change",()=>{
      currentLanguage=languageSelect.value;
      localStorage.setItem(LANGUAGE_KEY,currentLanguage);
      applyStaticLanguage();
      if(currentDetails) renderDetails(currentDetails);
      else if(viewerMode==="global-search"&&normalizeSearch(companySearch.value)) renderGlobalCompanySearch(normalizeSearch(companySearch.value));
      else if(viewerMessageKey) showViewerMessageKey(viewerMessageKey);
      else if(emptyState) showEmptyKey(emptyState.titleKey,emptyState.detailKey);
    });

    applyStaticLanguage();
    showEmptyKey("loadingArchive");
    let archiveAuthToken=0;
    onAuthStateChanged(auth,async user=>{
      const authToken=++archiveAuthToken;
      if(!user){
        archiveRequestToken++;
        currentDetails=null;currentGlobalSearchRows=[];currentUserIsAdmin=false;
        archivesByMonth.clear();archiveItems=[];sessionDetailCache.clear();
        monthSelect.disabled=true;companySearch.disabled=true;
        monthSelect.innerHTML=`<option value="">${escapeHtml(t("chooseMonth"))}</option>`;
        archiveDownload.classList.remove("show");archiveDownload.removeAttribute("href");
        viewer.classList.remove("show");viewer.innerHTML="";
        showEmptyKey("loginRequired","loginRequiredDetail");return;
      }
      try{
        const profile=await getDoc(doc(db,"authUsers",user.uid));
        if(authToken!==archiveAuthToken)return;
        if(!profile.exists()){
          archiveRequestToken++;
          currentDetails=null;currentGlobalSearchRows=[];currentUserIsAdmin=false;
          archivesByMonth.clear();archiveItems=[];sessionDetailCache.clear();
          monthSelect.disabled=true;companySearch.disabled=true;
          archiveDownload.classList.remove("show");archiveDownload.removeAttribute("href");
          viewer.classList.remove("show");viewer.innerHTML="";
          showEmptyKey("accessDenied","accessDeniedDetail");return;
        }
        const isAdmin=String(profile.data()?.role||"").trim().toLowerCase()==="admin";
        const snapshot=await getDocs(query(collection(db,"paymentArchives"),orderBy("month","desc")));
        if(authToken!==archiveAuthToken)return;
        const archives=snapshot.docs.map(item=>({id:item.id,...item.data()}));
        renderArchives(archives,isAdmin);
      }catch(error){
        if(authToken!==archiveAuthToken)return;
        console.error("PAYMENT ARCHIVE LOAD ERROR:",error);
        showEmptyKey("cannotLoad","cannotLoadDetail");
      }
    });
  </script>
</body>
</html>
