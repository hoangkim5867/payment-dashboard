name: Owner Payment write quota regression (Emulator only)
on:
  pull_request:
    paths:
      - 'security/firestore.rules.PROPOSED_STAGING_ONLY'
      - 'tests/firebase-rules/owner-write-quota.rules.test.cjs'
      - '.github/workflows/payment-owner-write-quota.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --legacy-peer-deps --no-audit --no-fund
        working-directory: tests/firebase-rules
      - name: Verify owner writes without profile, other accounts remain restricted
        working-directory: tests/firebase-rules
        run: npx firebase emulators:exec --project demo-payment-owner-quota --config firebase.json --only firestore "node --test owner-write-quota.rules.test.cjs"
