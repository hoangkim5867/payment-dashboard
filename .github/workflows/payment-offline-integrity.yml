name: Payment Offline Integrity
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify frozen reviewed RC files
        run: node tests/verify-release-files.cjs
      - name: Check JavaScript syntax
        run: python tests/verify_js_syntax.py
      - name: Current offline regression suite
        run: node --test tests/index-v1/*.test.cjs tests/secure/*.test.cjs tests/regression/*.test.cjs
      - name: Check Excel import and duplicate semantics
        run: |
          node tests/verify_preflight.cjs
          node tests/test_import_two_pass.cjs
          node tests/test_import_duplicate_equivalence.cjs
          node tests/test_mep_targeted_refresh.cjs
          node tests/test_export_watch_fallback.cjs
