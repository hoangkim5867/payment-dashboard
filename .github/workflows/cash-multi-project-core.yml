      - 'tests/cash-sync-source-readonly.test.cjs'
      - 'site/assets/js/cash-sync-project-source-coverage.mjs'
      - 'tests/cash-sync-project-source-coverage.test.mjs'
      - 'api/cash-shared-test-history-audit.js'
      - 'api/cash-shared-test-idempotency.js'
      - 'tests/cash-shared-test-idempotency.test.cjs'
      - 'api/cash-shared-test-real-compare.js'
