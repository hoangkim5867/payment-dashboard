name: Cash Multi Project Core
on:
  pull_request:
    paths:
      - 'server/cash-sync-multi-project-core.cjs'
      - 'server/cash-sync-multi-project-adapter.cjs'
      - 'api/cash-sync-multi-project.js'
      - 'api/cash-shared-test-history-audit.js'
      - 'api/cash-shared-test-idempotency.js'
      - 'tests/cash-shared-test-idempotency.test.cjs'
      - 'tests/cash-shared-test-history-audit.test.cjs'
      - 'tests/cash-multi-project-core.test.cjs'
      - 'tests/cash-multi-project-adapter.test.cjs'
      - 'tests/cash-multi-project-api.test.cjs'
      - '.github/workflows/cash-multi-project-core.yml'
  push:
    branches: [main]
    paths:
      - 'server/cash-sync-multi-project-core.cjs'
      - 'server/cash-sync-multi-project-adapter.cjs'
      - 'api/cash-sync-multi-project.js'
      - 'api/cash-shared-test-history-audit.js'
      - 'api/cash-shared-test-idempotency.js'
      - 'tests/cash-shared-test-idempotency.test.cjs'
      - 'tests/cash-shared-test-history-audit.test.cjs'
      - 'tests/cash-multi-project-core.test.cjs'
      - 'tests/cash-multi-project-adapter.test.cjs'
      - 'tests/cash-multi-project-api.test.cjs'
permissions:
  contents: read
jobs:
  offline-sync-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify no-write, idempotency and balance scenarios
        run: node --test tests/cash-multi-project-core.test.cjs tests/cash-multi-project-adapter.test.cjs tests/cash-multi-project-api.test.cjs tests/cash-shared-test-history-audit.test.cjs tests/cash-shared-test-idempotency.test.cjs
