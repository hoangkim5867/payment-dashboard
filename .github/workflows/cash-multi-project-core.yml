      - 'api/cash-shared-test-real-compare.js'
      - 'tests/cash-shared-test-real-compare.test.cjs'
      - 'tests/cash-google-ui-layout.test.cjs'
      - 'site/assets/js/cash-sync-batch-readiness.mjs'
