<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#15395f">
  <meta name="description" content="CSCEC MEP Payment Management System">
  <title>CSCEC MEP · Payment System</title>
  <style>
    :root{--navy:#15395f;--blue:#2d6d9d;--text:#18283a;--muted:#718096;--line:#e3e9f0;--bg:#f4f7fa;--white:#fff}
    *{box-sizing:border-box}html,body{min-height:100%}body{margin:0;color:var(--text);background:var(--bg);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
    .topbar{height:68px;display:flex;align-items:center;padding:0 clamp(18px,4vw,54px);border-bottom:1px solid var(--line);background:rgba(255,255,255,.94);backdrop-filter:blur(14px)}
    .brand{display:flex;align-items:center;gap:11px;font-weight:800}.brand-mark{width:36px;height:36px;display:block;flex:0 0 36px;border-radius:9px;object-fit:contain;background:#0788c9}
    main{min-height:calc(100vh - 68px);display:grid;place-items:center;padding:48px 20px}.workspace{width:min(880px,100%)}.heading{margin-bottom:27px}.heading h1{margin:0;font-size:clamp(30px,5vw,46px);line-height:1.08;letter-spacing:-.04em}
    .grid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}.card{min-height:148px;display:flex;align-items:flex-end;gap:17px;padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--white);box-shadow:0 10px 30px rgba(30,56,86,.06);transition:transform .18s,box-shadow .18s,border-color .18s}.card:hover{transform:translateY(-2px);border-color:#cbd8e5;box-shadow:0 16px 36px rgba(30,56,86,.1)}
    .card-primary{grid-row:span 2;min-height:310px;color:#fff;border-color:transparent;background:linear-gradient(145deg,#102d4d,#1c4d78 70%,#286d91);box-shadow:0 18px 42px rgba(18,56,94,.18)}.card-primary:hover{border-color:transparent;box-shadow:0 22px 48px rgba(18,56,94,.24)}
    .icon{width:46px;height:46px;display:grid;place-items:center;flex:0 0 auto;border-radius:13px;color:var(--navy);background:#edf4f9}.card-primary .icon{color:#fff;background:rgba(255,255,255,.14)}.icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .card-copy{min-width:0}.card h2{margin:0 0 5px;font-size:18px;letter-spacing:-.015em}.card p{margin:0;color:var(--muted);font-size:11px;line-height:1.5}.card-primary h2{font-size:25px}.card-primary p{color:#c4d7e8}.arrow{margin-left:auto;align-self:center;color:#91a0b0;font-size:20px}.card-primary .arrow{color:#fff}
    .card-disabled{cursor:default;background:#f8fafc;box-shadow:none}.card-disabled:hover{transform:none;border-color:var(--line);box-shadow:none}.card-disabled .icon{color:#9aa8b6;background:#edf1f5}.badge{display:inline-flex;margin-top:9px;padding:4px 8px;border-radius:999px;color:#7b8794;background:#e9eef3;font-size:8px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}
    @media(max-width:680px){main{place-items:start center;padding-top:54px}.grid{grid-template-columns:1fr}.card-primary{grid-row:auto;min-height:190px}.card{min-height:132px}.heading{margin-bottom:22px}}
  </style>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6QQBQ1C6FE"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-6QQBQ1C6FE');</script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./"><img class="brand-mark" src="./logo.png" alt="CSCEC"><span>中建二局安装工程有限公司</span></a>
  </header>
  <main>
    <section class="workspace">
      <div class="heading"><h1>Select a function</h1></div>
      <div class="grid">
        <a class="card card-primary" href="./payment.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 9h16M8 13h3M8 16h6"/></svg></span><span class="card-copy"><h2>Payment Management</h2><p>Track payment progress and history</p></span><span class="arrow">→</span></a>
        <a class="card" href="https://drive.google.com/drive/folders/1rfkI9U__twlV4KeHNCPvI_gxG8RrYmP6" target="_blank" rel="noopener"><span class="icon"><svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v10H3z"/></svg></span><span class="card-copy"><h2>Project Documents</h2><p>Contracts, IPCs and supporting documents</p></span><span class="arrow">↗</span></a>
        <div class="card card-disabled"><span class="icon"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 9l2 2 5-5M8 15h8"/></svg></span><span class="card-copy"><h2>Plan Review</h2><span class="badge">Coming soon</span></span></div>
      </div>
    </section>
  </main>
</body>
</html>
