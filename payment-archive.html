<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#15395f">
  <title>CSCEC MEP · Payment Archive</title>
  <style>
    :root{--navy:#15395f;--blue:#2d6d9d;--text:#18283a;--muted:#718096;--line:#e3e9f0;--bg:#f4f7fa;--white:#fff;--soft:#edf4f9}
    *{box-sizing:border-box}html,body{min-height:100%}body{margin:0;color:var(--text);background:var(--bg);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
    .topbar{height:68px;display:flex;align-items:center;padding:0 clamp(18px,4vw,54px);border-bottom:1px solid var(--line);background:rgba(255,255,255,.94);backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:11px;font-weight:800}.brand-mark{width:36px;height:36px;display:block;flex:0 0 36px;border-radius:9px;object-fit:contain;background:#0788c9}.back{margin-left:auto;display:inline-flex;align-items:center;gap:7px;color:#385b79;font-size:12px;font-weight:750}.back:hover{color:var(--navy)}
    main{width:100%;margin:0;padding:22px 12px 42px}.eyebrow{margin:0 0 8px;color:#54718c;font-size:11px;font-weight:850;letter-spacing:.1em;text-transform:uppercase}.heading{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:0 8px 14px}.heading h1{margin:0;font-size:27px;letter-spacing:-.025em}.heading p{max-width:510px;margin:9px 0 0;color:var(--muted);font-size:13px;line-height:1.55}.read-only{display:inline-flex;align-items:center;gap:7px;flex:0 0 auto;padding:8px 10px;border:1px solid #dbe6ef;border-radius:999px;color:#496781;background:#fff;font-size:11px;font-weight:750}.dot{width:7px;height:7px;border-radius:50%;background:#4bae73}
    .archive-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:10px}.archive-card{display:flex;flex-direction:column;min-height:136px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--white);box-shadow:0 4px 14px rgba(30,56,86,.045)}.archive-top{display:flex;align-items:flex-start;gap:10px}.month-icon{width:36px;height:36px;display:grid;place-items:center;flex:0 0 auto;border-radius:10px;color:var(--navy);background:var(--soft)}.month-icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.archive-card h2{margin:1px 0 3px;font-size:14px;letter-spacing:-.01em}.archive-card p{margin:0;color:var(--muted);font-size:10px;line-height:1.45}.month-tag{display:none}.archive-actions{display:flex;gap:7px;margin-top:auto;padding-top:10px}.archive-actions button,.archive-actions a{display:inline-flex;align-items:center;justify-content:center;min-height:29px;padding:0 9px;border-radius:7px;font-size:10px;font-weight:800}.archive-actions button{border:1px solid var(--navy);color:#fff;background:var(--navy)}.archive-actions .pdf{border:1px solid #d7e2eb;color:#385a78;background:#fff}.archive-actions .excel{border:1px solid #d7e2eb;color:#385a78;background:#fff}.archive-actions button:hover,.archive-actions a:hover{filter:brightness(.97);transform:translateY(-1px)}.archive-actions a[hidden]{display:none}
    .archive-viewer{display:none;margin-top:14px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 4px 14px rgba(30,56,86,.045);overflow:hidden}.archive-viewer.show{display:block}.viewer-heading{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:12px 14px;border-bottom:1px solid var(--line)}.viewer-heading h2{margin:0;font-size:17px}.viewer-heading p{margin:3px 0 0;color:var(--muted);font-size:10px}.viewer-close{border:0;border-radius:7px;padding:6px 8px;color:#385a78;background:#edf4f9;font-size:10px;font-weight:800}.viewer-summary{display:flex;gap:14px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line);background:#fbfdff}.viewer-summary span{padding:0;color:#526f88;background:transparent;font-size:10px;font-weight:800}.viewer-table-wrap{overflow:auto}.viewer-table{width:100%;min-width:910px;border-collapse:collapse;font-size:10.5px}.viewer-table th{position:sticky;top:0;padding:8px 9px;color:#fff;background:#15395f;text-align:left;white-space:nowrap}.viewer-table td{padding:8px 9px;border-bottom:1px solid #e7edf3;vertical-align:top}.viewer-table tr:nth-child(even) td{background:#fbfdff}.viewer-table .project-row td{padding:7px 9px;color:#17365d;background:#edf4f9!important;font-size:10px;font-weight:850;letter-spacing:.035em}.viewer-table .right{text-align:right;font-weight:800;white-space:nowrap}.viewer-table .center{text-align:center;white-space:nowrap}.unc-link{display:inline-flex;padding:4px 7px;border:1px solid #d7e2eb;border-radius:6px;color:#385a78;background:#fff;font-size:9.5px;font-weight:800}.unc-missing{color:#96a3b0;font-size:9.5px}.viewer-message{padding:22px 14px;color:var(--muted);font-size:11px}
    .empty{display:grid;place-items:center;min-height:280px;padding:34px;border:1px dashed #ccd9e4;border-radius:18px;color:var(--muted);background:rgba(255,255,255,.62);text-align:center}.empty-icon{width:54px;height:54px;display:grid;place-items:center;margin:0 auto 13px;border-radius:16px;color:#64809a;background:#eaf1f6}.empty-icon svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.7}.empty h2{margin:0 0 7px;color:#415b74;font-size:17px}.empty p{max-width:410px;margin:0;font-size:12px;line-height:1.6}.note{display:flex;gap:10px;margin-top:21px;padding:13px 15px;border-left:3px solid #2d6d9d;color:#587087;background:#edf4f9;font-size:11px;line-height:1.55}.note strong{color:#294b6a}
    @media(max-width:620px){main{padding-top:34px}.heading{display:block}.read-only{margin-top:17px}.archive-grid{grid-template-columns:1fr}.topbar{padding:0 18px}.brand span{font-size:13px}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./"><img class="brand-mark" src="./logo.png" alt="CSCEC"><span>中建二局安装工程有限公司</span></a>
    <a class="back" href="./">← Trang chủ</a>
  </header>
  <main>
    <div class="heading">
      <div>
        <h1>Kho chứng từ thanh toán</h1>
      </div>
    </div>
    <section class="archive-grid" id="archiveGrid" aria-label="Danh sách báo cáo theo tháng"></section>
    <section class="archive-viewer" id="archiveViewer" aria-live="polite"></section>
  </main>
  <script type="module">
    import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {getFirestore,collection,query,orderBy,getDocs,getDoc,doc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig={apiKey:"AIzaSyCApKWORskui_858na0gqnxh3UPzg0mvgE",authDomain:"cscecmep-payment.firebaseapp.com",projectId:"cscecmep-payment",storageBucket:"cscecmep-payment.firebasestorage.app",messagingSenderId:"217279768663",appId:"1:217279768663:web:ad6b423078aee5ca925b12"};
    const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
    const grid=document.getElementById("archiveGrid");
    const viewer=document.getElementById("archiveViewer");
    const escapeHtml=value=>String(value??"").replace(/[&<>'"]/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[char]));
    const icon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h6M9 16h6"/></svg>';
    const moneyMonth=month=>{const [year,value]=String(month||"").split("-");return value&&year?`Tháng ${Number(value)} / ${year}`:month||"Báo cáo"};
    const safeUrl=value=>/^https:\/\//i.test(String(value||"").trim())?String(value).trim():"";
    const formatMoney=value=>Number(value||0).toLocaleString("vi-VN");
    const uncPreview=fileId=>`https://drive.google.com/file/d/${encodeURIComponent(String(fileId||"").trim())}/preview`;
    const showEmpty=(title,detail)=>{grid.innerHTML=`<div class="empty"><div><div class="empty-icon">${icon}</div><h2>${escapeHtml(title)}</h2><p>${escapeHtml(detail)}</p></div></div>`};
    const renderArchives=(archives,isAdmin=false)=>{
      if(!archives.length){showEmpty("Chưa có dữ liệu","Chưa có tháng nào được chốt.");return;}
      grid.innerHTML=archives.map(item=>{const excel=safeUrl(item.excelDownloadUrl||item.excelUrl);const actions=`<div class="archive-actions"><button type="button" class="open-archive" data-month="${escapeHtml(item.month)}">Xem chi tiết</button>${isAdmin&&excel?`<a class="excel" href="${escapeHtml(excel)}" target="_blank" rel="noopener">Tải Excel ↗</a>`:""}</div>`;return `<article class="archive-card"><div class="archive-top"><div class="month-icon">${icon}</div><div><h2>${escapeHtml(moneyMonth(item.month))}</h2><p>${escapeHtml(item.description||"Danh sách khoản đã thanh toán")}</p></div></div>${actions}</article>`}).join("");
    };

    const showViewerMessage=message=>{
      viewer.classList.add("show");
      viewer.innerHTML=`<div class="viewer-message">${escapeHtml(message)}</div>`;
      viewer.scrollIntoView({behavior:"smooth",block:"start"});
    };
    const renderDetails=details=>{
      const rows=Array.isArray(details?.rows)?details.rows:[];
      const month=String(details?.month||"");
      const total=Number(details?.totalActualAmount||0);
      const uncCount=Number(details?.uncCount||0);
      const sortedRows=[...rows].sort((a,b)=>{
        const projectCompare=String(a.project||"").localeCompare(String(b.project||""),"vi",{sensitivity:"base"});
        if(projectCompare) return projectCompare;
        const dateCompare=String(b.paymentDate||"").localeCompare(String(a.paymentDate||""));
        if(dateCompare) return dateCompare;
        return String(a.contractNo||"").localeCompare(String(b.contractNo||""));
      });
      let previousProject=null;
      const body=sortedRows.map((row,index)=>{
        const unc=String(row.uncFileId||"").trim();
        const project=String(row.project||"Chưa gắn dự án");
        const divider=project!==previousProject?`<tr class="project-row"><td colspan="8">${escapeHtml(project)}</td></tr>`:"";
        previousProject=project;
        return `${divider}<tr><td class="center">${index+1}</td><td>${escapeHtml(row.company)}</td><td>${escapeHtml(row.contractNo)}</td><td>${escapeHtml(row.contractName)}</td><td class="center">${escapeHtml(row.ipcNo)}</td><td class="right">${formatMoney(row.actualAmount)}</td><td class="center">${escapeHtml(row.paymentDate)}</td><td class="center">${unc?`<a class="unc-link" href="${uncPreview(unc)}" target="_blank" rel="noopener">Xem UNC</a>`:`<span class="unc-missing">Chưa có</span>`}</td></tr>`;
      }).join("");
      viewer.classList.add("show");
      viewer.innerHTML=`<div class="viewer-heading"><div><h2>${escapeHtml(moneyMonth(month))}</h2><p>Đã thanh toán</p></div><button class="viewer-close" type="button" id="closeArchiveViewer">Đóng</button></div><div class="viewer-summary"><span>${rows.length} khoản</span><span>${formatMoney(total)} VND</span><span>${uncCount} UNC</span></div><div class="viewer-table-wrap"><table class="viewer-table"><thead><tr><th>STT</th><th>Công ty</th><th>Số hợp đồng</th><th>Nội dung hợp đồng</th><th>IPC</th><th>Số tiền thực tế</th><th>Ngày thanh toán</th><th>UNC</th></tr></thead><tbody>${body||`<tr><td colspan="8" class="center">Chưa có dữ liệu</td></tr>`}</tbody></table></div>`;
      viewer.scrollIntoView({behavior:"smooth",block:"start"});
    };

    grid.addEventListener("click",async event=>{
      const button=event.target.closest(".open-archive");
      if(!button) return;
      const month=String(button.dataset.month||"").trim();
      if(!month) return;
      button.disabled=true;
      button.textContent="Đang mở...";
      try{
        const details=await getDoc(doc(db,"paymentArchiveDetails",month));
        if(!details.exists()){
          showViewerMessage("Tháng này chưa có dữ liệu xem trên web. Admin cần chốt lại tháng một lần.");
          return;
        }
        renderDetails(details.data());
      }catch(error){
        console.error("PAYMENT ARCHIVE DETAIL ERROR:",error);
        showViewerMessage("Không mở được dữ liệu tháng này. Hãy thử lại sau.");
      }finally{
        button.disabled=false;
        button.textContent="Xem chi tiết";
      }
    });
    viewer.addEventListener("click",event=>{
      if(event.target.closest("#closeArchiveViewer")){
        viewer.classList.remove("show");
        viewer.innerHTML="";
      }
    });

    showEmpty("Đang tải Kho chứng từ...","");
    onAuthStateChanged(auth,async user=>{
      if(!user){showEmpty("Cần đăng nhập","Hãy đăng nhập Payment Management trước, rồi mở lại Kho chứng từ.");return;}
      try{
        const profile=await getDoc(doc(db,"authUsers",user.uid));
        if(!profile.exists()){showEmpty("Không có quyền truy cập","Tài khoản này chưa được cấp quyền vào hệ thống Payment.");return;}
        const snapshot=await getDocs(query(collection(db,"paymentArchives"),orderBy("month","desc")));
        const isAdmin=String(profile.data()?.role||"").trim().toLowerCase()==="admin";
        renderArchives(snapshot.docs.map(item=>({id:item.id,...item.data()})),isAdmin);
      }catch(error){
        console.error("PAYMENT ARCHIVE LOAD ERROR:",error);
        showEmpty("Không tải được Kho chứng từ","Hãy đăng nhập lại Payment Management rồi thử lại.");
      }
    });
  </script>
</body>
</html>
